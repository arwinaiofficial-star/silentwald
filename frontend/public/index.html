<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#1A3626" />
        <meta
            name="description"
            content="Silent Wald — A 250-acre forest sanctuary near Hyderabad. Premium cottages, wedding lawns, corporate retreats, and unforgettable getaways since 2000."

        <title>Silent Wald — A Forest Sanctuary near Hyderabad</title>

        <!-- Hidden Netlify form detection (required for static build) -->
        <form name="contact" netlify netlify-honeypot="bot-field" hidden>

            <input type="email" name="email" />
            <input type="tel" name="phone" />
            <input type="text" name="event-type" />

            <input type="date" name="date" />
            <textarea name="message"></textarea>
        </form>

        <div id="root"></div>
